<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Map ハイブリッド検索</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; background: white; padding: 30px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #4a5568; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        input[type="file"] { width: 100%; padding: 10px; border: 2px dashed #cbd5e0; border-radius: 8px; cursor: pointer; box-sizing: border-box; }
        button { 
            width: 100%; background: #2b6cb0; color: white; border: none; padding: 14px; 
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; 
        }
        button:hover { background: #2c5282; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        .loading { text-align: center; color: #718096; display: none; margin-top: 15px; font-weight: bold; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; background: #f7fafc; border: 1px solid #e2e8f0; display: none; }
        #map { height: 350px; width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid #cbd5e0; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI & Map Hybrid Finder 📍</h1>
    
    <div class="form-group">
        <label for="imageInput" style="font-weight: bold; display: block; margin-bottom: 8px;">写真をアップロード：</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>
    
    <button id="uploadBtn">AIと地図で場所を特定する</button>

    <div class="loading" id="loadingText">⏳ AIが解析中...（混雑時は少し時間がかかります）</div>

    <div id="resultArea" class="result-box">
        <h3 style="margin-top:0; color: #2b6cb0;">📍 検索・特定結果</h3>
        <p id="resReason"></p>
        <p id="resQuery"></p>
        <p id="resAddress" style="font-size: 0.9em; color: #4a5568;"></p>
        
        <div id="map"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const imageInput = document.getElementById('imageInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const loadingText = document.getElementById('loadingText');
        const resultArea = document.getElementById('resultArea');
        const resReason = document.getElementById('resReason');
        const resQuery = document.getElementById('resQuery');
        const resAddress = document.getElementById('resAddress');
        
        let map = null;
        let marker = null;

        // 🚀 画像を送信前に超軽量化（JPEG変換）してGroqの400エラーを防ぐ魔法の処理
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        
                        // 画像が大きすぎる場合は縮小
                        if (w > maxWidth || h > maxWidth) {
                            if (w > h) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                            else { w = Math.round((w * maxWidth) / h); h = maxWidth; }
                        }
                        canvas.width = w; 
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        // 軽量なJPEGとして出力
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        uploadBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                alert('写真を選択してください！');
                return;
            }

            uploadBtn.disabled = true;
            loadingText.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                // 1. まずブラウザ側で画像を軽量化（10MBのスクショも数十KBになります）
                const safeBlob = await compressImage(file);
                
                const formData = new FormData();
                // 2. 日本語ファイル名によるエラーも防ぐため、名前を固定して送信
                formData.append('file', safeBlob, 'safe_image.jpg');

                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || '解析に失敗しました。');
                }

                resultArea.style.display = 'block';
                resReason.innerHTML = `<strong>AIの推理:</strong> ${result.reason}`;
                resQuery.innerHTML = `<strong>検索ワード:</strong> <span style="color:#c53030">${result.query_used}</span>`;
                resAddress.innerHTML = `<strong>特定された住所:</strong> ${result.location}`;

                const lat = result.lat;
                const lng = result.lng;

                if (map === null) {
                    map = L.map('map').setView([lat, lng], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);
                    marker = L.marker([lat, lng]).addTo(map);
                } else {
                    map.setView([lat, lng], 14);
                    marker.setLatLng([lat, lng]);
                }
                
                setTimeout(() => { map.invalidateSize(); }, 200);

            } catch (error) {
                alert('エラー: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        });
    });
</script>

</body>
</html>
