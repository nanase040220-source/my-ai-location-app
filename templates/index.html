<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Location Finder</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: white; padding: 30px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #4a5568; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        input[type="file"] { width: 100%; padding: 10px; border: 2px dashed #cbd5e0; border-radius: 8px; cursor: pointer; }
        button { 
            width: 100%; 
            background: #4299e1; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s; 
            margin-top: 10px;
        }
        button:hover { background: #3182ce; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        .result-box { margin-top: 25px; padding: 15px; border-radius: 8px; background: #f7fafc; border: 1px solid #e2e8f0; display: none; }
        .result-title { font-weight: bold; color: #2b6cb0; margin-bottom: 5px; }
        .loading { text-align: center; color: #718096; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Location Finder 📍</h1>
    
    <div class="form-group">
        <label for="imageInput" style="font-weight: bold; display: block; margin-bottom: 8px;">写真を選択してください：</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>
    
    <button id="uploadBtn">場所を推測する</button>

    <div class="loading" id="loadingText">⏳ AIが場所を解析中...（10秒ほどかかります）</div>

    <div id="geminiResult" class="result-box">
        <div class="result-title">🤖 Geminiの予測</div>
        <div id="geminiContent"></div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const loadingText = document.getElementById('loadingText');
    const geminiResult = document.getElementById('geminiResult');
    const geminiContent = document.getElementById('geminiContent');

    uploadBtn.addEventListener('click', async () => {
        const file = imageInput.files[0];
        if (!file) {
            alert('写真を選んでからボタンを押してください！');
            return;
        }

        uploadBtn.disabled = true;
        loadingText.style.display = 'block';
        geminiResult.style.display = 'none';

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error('サーバー側でエラーが発生しました。');
            }

            const result = await response.json();

            geminiResult.style.display = 'block';
            if (result.gemini.status === 'success') {
                try {
                    const data = JSON.parse(result.gemini.data);
                    geminiContent.innerHTML = `<strong>場所:</strong> ${data.location}<br><strong>座標:</strong> 緯度 ${data.lat}, 経度 ${data.lng}<br><strong>理由:</strong> ${data.reason}`;
                } catch(e) {
                    geminiContent.innerText = result.gemini.data;
                }
            } else {
                geminiContent.style.color = 'red';
                geminiContent.innerText = result.gemini.message;
            }

        } catch (error) {
            alert('エラーが発生しました: ' + error.message);
        } finally {
            uploadBtn.disabled = false;
            loadingText.style.display = 'none';
        }
    });
</script>

</body>
</html>
