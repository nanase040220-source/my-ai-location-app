<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Map ハイブリッド検索</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; background: white; padding: 30px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #4a5568; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        input[type="file"] { width: 100%; padding: 10px; border: 2px dashed #cbd5e0; border-radius: 8px; cursor: pointer; box-sizing: border-box; }
        button { 
            width: 100%; background: #2b6cb0; color: white; border: none; padding: 14px; 
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; 
        }
        button:hover { background: #2c5282; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        
        /* 📈 パーセント進捗バーのスタイル */
        .progress-container { display: none; margin-top: 20px; background: #edf2f7; border-radius: 8px; padding: 4px; border: 1px solid #e2e8f0; }
        .progress-bar { width: 0%; height: 16px; background: linear-gradient(90deg, #3182ce, #63b3ed); border-radius: 6px; transition: width 0.3s ease; }
        .progress-text { text-align: center; color: #2b6cb0; margin-top: 8px; font-weight: bold; font-size: 14px; }
        
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; background: #f7fafc; border: 1px solid #e2e8f0; display: none; }
        #map { height: 350px; width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid #cbd5e0; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI & Map Hybrid Finder 📍</h1>
    
    <div class="form-group">
        <label for="imageInput" style="font-weight: bold; display: block; margin-bottom: 8px;">写真をアップロード：</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>
    
    <button id="uploadBtn">AIと地図で場所を特定する</button>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">⏳ 準備中... 0%</div>
    </div>

    <div id="resultArea" class="result-box">
        <h3 style="margin-top:0; color: #2b6cb0;">📍 検索・特定結果</h3>
        <p id="resReason"></p>
        <p id="resQuery"></p>
        <p id="resAddress" style="font-size: 0.9em; color: #4a5568;"></p>
        
        <div id="map"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const imageInput = document.getElementById('imageInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const resultArea = document.getElementById('resultArea');
        const resReason = document.getElementById('resReason');
        const resQuery = document.getElementById('resQuery');
        const resAddress = document.getElementById('resAddress');
        
        let map = null;
        let marker = null;

        // 🛠️ 画像を自動でリサイズ＆JPEG圧縮して、容量を劇的に減らす関数
        function resizeAndCompressImage(file, maxWidth = 1200, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth || height > maxWidth) {
                            if (width > height) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            } else {
                                width = Math.round((width * maxWidth) / height);
                                height = maxWidth;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('画像の圧縮に失敗しました。'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        uploadBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) {
                alert('写真を選択してください！');
                return;
            }

            uploadBtn.disabled = true;
            progressContainer.style.display = 'block';
            resultArea.style.display = 'none';

            // 📈 進捗スタート: 5%
            let currentProgress = 5;
            progressBar.style.width = currentProgress + '%';
            progressText.innerText = `画像を最適化中... ${currentProgress}%`;

            let progressTimer;

            try {
                // 1. 画像を軽量なデータに自動変換（ここでGroqの400エラーを封殺）
                const compressedBlob = await resizeAndCompressImage(file);
                
                currentProgress = 20;
                progressBar.style.width = currentProgress + '%';
                progressText.innerText = `データをサーバーへ送信中... ${currentProgress}%`;

                const formData = new FormData();
                // 🩹 日本語ファイル名による不具合を防ぐため、一律 'upload.jpg' に固定して送信
                formData.append('file', compressedBlob, 'upload.jpg');

                // 2. AIの解析を待つ間、じわじわとパーセントを進めるタイマー（最大95%まで）
                progressTimer = setInterval(() => {
                    if (currentProgress < 95) {
                        currentProgress += Math.floor(Math.random() * 3) + 1; // 1~3%ずつランダムに上昇
                        if (currentProgress > 95) currentProgress = 95;
                        progressBar.style.width = currentProgress + '%';
                        
                        if (currentProgress < 50) {
                            progressText.innerText = `AIが画像の特徴をスキャン中... ${currentProgress}%`;
                        } else if (currentProgress < 80) {
                            progressText.innerText = `地理データベースと照合中... ${currentProgress}%`;
                        } else {
                            progressText.innerText = `サーバーからの応答を待機中（混雑時は自動リトライします）... ${currentProgress}%`;
                        }
                    }
                }, 450);

                // 3. 実際のAPI通信
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || '解析に失敗しました。');
                }

                // 4. 解析成功！一気に100%へ
                clearInterval(progressTimer);
                progressBar.style.width = '100%';
                progressText.innerText = '解析完了！ 100%';

                // 少し余韻を持たせてから結果を表示
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    resultArea.style.display = 'block';
                }, 400);

                resReason.innerHTML = `<strong>AIの推理:</strong> ${result.reason}`;
                resQuery.innerHTML = `<strong>使用した検索ワード:</strong> <span style="color:#c53030">${result.query_used}</span>`;
                resAddress.innerHTML = `<strong>特定された住所:</strong> ${result.location}`;

                const lat = result.lat;
                const lng = result.lng;

                if (map === null) {
                    map = L.map('map').setView([lat, lng], 14);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);
                    marker = L.marker([lat, lng]).addTo(map);
                } else {
                    map.setView([lat, lng], 14);
                    marker.setLatLng([lat, lng]);
                }
                
                setTimeout(() => { map.invalidateSize(); }, 200);

            } catch (error) {
                if (progressTimer) clearInterval(progressTimer);
                progressContainer.style.display = 'none';
                alert('エラー: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
            }
        });
    });
</script>

</body>
</html>
