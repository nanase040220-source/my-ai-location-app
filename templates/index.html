<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理・地形特化 AIロケーター</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0f172a; margin: 0; padding: 20px; color: #f8fafc; }
        .container { max-width: 800px; background: #1e293b; padding: 30px; margin: 0 auto; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #94a3b8; }
        input[type="file"] { width: 100%; padding: 12px; background: #0f172a; border: 2px dashed #334155; border-radius: 8px; color: #94a3b8; cursor: pointer; box-sizing: border-box; }
        textarea { width: 100%; height: 70px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; box-sizing: border-box; resize: vertical; }
        textarea:focus { border-color: #38bdf8; outline: none; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #334155; cursor: not-allowed; }
        
        .progress-container { display: none; margin-top: 20px; background: #0f172a; border-radius: 10px; padding: 4px; border: 1px solid #334155; }
        .progress-bar { width: 0%; height: 16px; background: linear-gradient(90deg, #0284c7, #38bdf8); border-radius: 8px; transition: width 0.4s ease; }
        .progress-text { text-align: center; color: #38bdf8; margin-top: 8px; font-weight: bold; font-size: 14px; }
        
        .result-box { margin-top: 25px; padding: 20px; border-radius: 12px; background: #0f172a; border: 1px solid #334155; display: none; }
        .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .analysis-card { background: #1e293b; padding: 12px; border-radius: 8px; border-left: 4px solid #38bdf8; }
        .analysis-card h5 { margin: 0 0 5px 0; color: #38bdf8; font-size: 14px; }
        .analysis-card p { margin: 0; font-size: 13px; color: #cbd5e1; line-height: 1.4; }
        .full-width { grid-column: span 2; border-left-color: #a855f7; }

        .candidate-list { list-style: none; padding: 0; margin: 15px 0; }
        .candidate-item { padding: 15px; margin-bottom: 12px; border-radius: 8px; background: #1e293b; border-left: 5px solid #64748b; }
        .candidate-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .rank-1 { border-left-color: #ef4444; }
        .rank-2 { border-left-color: #3b82f6; }
        .rank-3 { border-left-color: #10b981; }
        .prob-badge { font-weight: bold; padding: 2px 10px; border-radius: 20px; background: #334155; color: #cbd5e1; }
        .rank-1 .prob-badge { background: #fef2f2; color: #991b1b; }

        .btn-group { display: flex; gap: 8px; }
        .verify-btn { flex: 1; padding: 8px; font-size: 12px; background: #475569; text-align: center; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .verify-btn:hover { background: #334155; }
        .btn-img { background: #ea580c; } .btn-img:hover { background: #c2410c; }
        .btn-sv { background: #0d9488; } .btn-sv:hover { background: #0f766e; }
        
        #map { height: 380px; width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌍 地理・地形特化型 AI探偵システム</h1>
    
    <div class="form-group">
        <label for="imageInput">写真をアップロード：</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="form-group">
        <label for="hintInput">既知のヒント（言語、国、気候など）：</label>
        <textarea id="hintInput" placeholder="例: ヨーロッパのどこか、ガードレールが白い、などAIの手がかりになる情報"></textarea>
    </div>
    
    <button id="uploadBtn">大地の特徴から場所を特定する</button>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">⏳ 解析準備中... 0%</div>
    </div>

    <div id="resultArea" class="result-box">
        <h3 style="margin-top:0; color: #38bdf8;">📊 科学的・地理的分析結果</h3>
        
        <div class="analysis-grid">
            <div class="analysis-card">
                <h5>⛰️ 地形・地勢 (Topography)</h5>
                <p id="anTopo"></p>
            </div>
            <div class="analysis-card">
                <h5>🪨 土壌・地質 (Soil & Rock)</h5>
                <p id="anSoil"></p>
            </div>
            <div class="analysis-card">
                <h5>🌿 植生・バイオーム (Vegetation)</h5>
                <p id="anVeg"></p>
            </div>
            <div class="analysis-card">
                <h5>🏠 建築・インフラ (Architecture)</h5>
                <p id="anArchi"></p>
            </div>
            <div class="analysis-card">
                <h5>☀️ 太陽光・影の角度 (Sun & Shadow)</h5>
                <p id="anShadow"></p>
            </div>
            <div class="analysis-card full-width">
                <h5>🧠 総合推論ロジック (Reasoning)</h5>
                <p id="resLogic"></p>
            </div>
        </div>
        
        <h4 style="margin-bottom: 5px; color: #94a3b8;">🗺️ 推定される候補地リスト</h4>
        <ul id="candidateList" class="candidate-list"></ul>
        
        <div id="map"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const imageInput = document.getElementById('imageInput');
        const hintInput = document.getElementById('hintInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const resultArea = document.getElementById('resultArea');
        
        const anTopo = document.getElementById('anTopo');
        const anSoil = document.getElementById('anSoil');
        const anVeg = document.getElementById('anVeg');
        const anArchi = document.getElementById('anArchi');
        const anShadow = document.getElementById('anShadow');
        const resLogic = document.getElementById('resLogic');
        const candidateList = document.getElementById('candidateList');
        
        let map = null;
        let markersGroup = [];

        function createIcon(colorFilter) {
            return L.divIcon({
                className: 'custom-pin',
                html: `<img src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png" style="filter: ${colorFilter}; width: 25px; height: 41px; margin-left: -12px; margin-top: -41px;">`,
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34]
            });
        }

        const icons = [
            createIcon("hue-rotate(140deg) brightness(0.9) contrast(1.2)"), 
            createIcon("none"),                                            
            createIcon("hue-rotate(260deg) saturate(1.5)")                 
        ];

        // 🛠️ 画像を安全なサイズに自動圧縮する関数
        function compressImage(file, maxWidth = 1200, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxWidth || h > maxWidth) {
                            if (w > h) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                            else { w = Math.round((w * maxWidth) / h); h = maxWidth; }
                        }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', quality);
                    };
                };
                reader.onerror = (err) => reject(err);
            });
        }

        uploadBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) { alert('写真を選択してください！'); return; }

            uploadBtn.disabled = true;
            progressContainer.style.display = 'block';
            resultArea.style.display = 'none';
            candidateList.innerHTML = '';
            
            let currentProgress = 5;
            progressBar.style.width = currentProgress + '%';
            progressText.innerText = `画像を最適化中... ${currentProgress}%`;

            const progressTimer = setInterval(() => {
                if (currentProgress < 95) {
                    currentProgress += Math.floor(Math.random() * 3) + 1;
                    if (currentProgress > 95) currentProgress = 95;
                    progressBar.style.width = currentProgress + '%';
                    
                    if (currentProgress < 40) {
                        progressText.innerText = `画像を精査中... ${currentProgress}%`;
                    } else if (currentProgress < 75) {
                        progressText.innerText = `地形・植生・影の角度をスキャン中... ${currentProgress}%`;
                    } else {
                        progressText.innerText = `サーバーと通信中（混雑時は自動リトライします）... ${currentProgress}%`;
                    }
                }
            }, 400);

            try {
                // 送信前に画像を圧縮
                const compressedBlob = await compressImage(file);
                const formData = new FormData();
                // 日本語ファイル名エラーを防ぐため 'upload.jpg' に名称を固定
                formData.append('file', compressedBlob, 'upload.jpg');
                formData.append('hint', hintInput.value);

                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const result = await response.json();

                if (!response.ok || !result.success) throw new Error(result.message || '解析に失敗しました。');

                clearInterval(progressTimer);
                progressBar.style.width = '100%';
                progressText.innerText = '解析完了！ 100%';

                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    resultArea.style.display = 'block';
                }, 500);
                
                anTopo.innerText = result.analysis.topography;
                anSoil.innerText = result.analysis.soil;
                anVeg.innerText = result.analysis.vegetation;
                anArchi.innerText = result.analysis.architecture;
                anShadow.innerText = result.analysis.shadows;
                resLogic.innerText = result.reasoning_logic;

                if (map === null) {
                    map = L.map('map');
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);
                }

                markersGroup.forEach(m => map.removeLayer(m));
                markersGroup = [];
                const bounds = [];

                result.candidates.forEach((candidate, index) => {
                    const rank = index + 1;
                    const encodedLocation = encodeURIComponent(candidate.location);
                    const googleImagesUrl = `https://www.google.com/search?tbm=isch&q=${encodedLocation}`;
                    
                    // 🗺️ 【ストリートビューURL完全修復】
                    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${candidate.lat},${candidate.lng}`;

                    const li = document.createElement('li');
                    li.className = `candidate-item rank-${rank}`;
                    li.innerHTML = `
                        <div class="candidate-header">
                            <div><strong>第${rank}候補:</strong> ${candidate.location}</div>
                            <span class="prob-badge">${candidate.probability}</span>
                        </div>
                        <div class="btn-group">
                            <a href="${googleImagesUrl}" target="_blank" class="verify-btn btn-img">🔍 画像検索</a>
                            <a href="${streetViewUrl}" target="_blank" class="verify-btn btn-sv">🚗 周辺のストリートビュー</a>
                        </div>
                    `;
                    candidateList.appendChild(li);

                    const markerIcon = icons[index] || icons[1];
                    const marker = L.marker([candidate.lat, candidate.lng], { icon: markerIcon })
                        .addTo(map)
                        .bindPopup(`<b>第${rank}候補</b><br>${candidate.location}<br>確率: ${candidate.probability}`);
                    
                    markersGroup.push(marker);
                    bounds.push([candidate.lat, candidate.lng]);
                    
                    if (index === 0) marker.openPopup();
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
                }
                
                setTimeout(() => { map.invalidateSize(); }, 200);

            } catch (error) {
                clearInterval(progressTimer);
                progressContainer.style.display = 'none';
                alert('エラー: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
            }
        });
    });
</script>
</body>
</html>
